{% set logo_prefix = logo_prefix|default('logo') %}

<!-- Crop Modal for Logo -->
<div class="modal fade" id="{{ logo_prefix }}CropLogoModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Crop Logo Sekolah</h5>
            </div>
            <div class="modal-body text-center">
                <div style="max-height: 350px; overflow: hidden;">
                    <img id="{{ logo_prefix }}CropLogoImage" src="" style="max-width: 100%; display: block;">
                </div>
                <div class="mt-3 d-flex align-items-center gap-2 justify-content-center">
                    <i class="bi bi-dash-lg"></i>
                    <input type="range" id="{{ logo_prefix }}CropLogoZoom" class="form-range" style="width: 200px;"
                        min="0.1" max="3" step="0.1" value="1">
                    <i class="bi bi-plus-lg"></i>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal"
                    id="{{ logo_prefix }}CropLogoCancel">Batal</button>
                <button type="button" class="btn btn-primary" id="{{ logo_prefix }}CropLogoConfirm">
                    <i class="bi bi-check-lg me-1"></i>OK
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Cropper.js CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.1/dist/cropper.min.css">
<script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.1/dist/cropper.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        var prefix = "{{ logo_prefix }}";
        var cropper = null;
        var cropModalEl = document.getElementById(prefix + 'CropLogoModal');
        var logoFileInput = document.getElementById(prefix + 'LogoFile');
        var cropImage = document.getElementById(prefix + 'CropLogoImage');
        var cropZoom = document.getElementById(prefix + 'CropLogoZoom');
        var cropConfirm = document.getElementById(prefix + 'CropLogoConfirm');
        var logoPreview = document.getElementById(prefix + 'LogoPreview');
        var logoPlaceholder = document.getElementById(prefix + 'LogoPlaceholder');
        var logoDataInput = document.getElementById(prefix + 'LogoData');

        if (!cropModalEl || !logoFileInput || !cropImage || !window.bootstrap || !window.Cropper) {
            return;
        }

        var cropModal = new bootstrap.Modal(cropModalEl);

        logoFileInput.addEventListener('change', function (e) {
            var file = e.target.files[0];
            if (!file || !file.type.startsWith('image/')) return;

            var reader = new FileReader();
            reader.onload = function (ev) {
                cropImage.src = ev.target.result;
                cropModal.show();

                cropModalEl.addEventListener('shown.bs.modal', function () {
                    if (cropper) cropper.destroy();
                    cropper = new Cropper(cropImage, {
                        aspectRatio: 1,
                        viewMode: 1,
                        dragMode: 'move',
                        cropBoxMovable: false,
                        cropBoxResizable: false,
                        toggleDragModeOnDblclick: false,
                        minContainerWidth: 250,
                        minContainerHeight: 250,
                        background: false,
                        ready: function () {
                            cropZoom.value = 1;
                        }
                    });
                }, { once: true });
            };
            reader.readAsDataURL(file);
        });

        if (cropZoom) {
            cropZoom.addEventListener('input', function () {
                if (cropper) {
                    cropper.zoomTo(parseFloat(this.value));
                }
            });
        }

        if (cropConfirm) {
            cropConfirm.addEventListener('click', function () {
                if (!cropper) return;

                var canvas = cropper.getCroppedCanvas({
                    width: 400,
                    height: 400,
                    imageSmoothingQuality: 'high'
                });

                var quality = 0.9;
                var dataUrl;
                do {
                    dataUrl = canvas.toDataURL('image/jpeg', quality);
                    quality -= 0.1;
                } while (dataUrl.length / 1.37 > 100 * 1024 && quality > 0.1);

                if (logoPreview) {
                    logoPreview.src = dataUrl;
                    logoPreview.style.display = 'block';
                }
                if (logoPlaceholder) {
                    logoPlaceholder.style.display = 'none';
                }
                if (logoDataInput) {
                    logoDataInput.value = dataUrl;
                }

                cropper.destroy();
                cropper = null;
                cropModal.hide();
                logoFileInput.value = '';
            });
        }

        cropModalEl.addEventListener('hidden.bs.modal', function () {
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
            logoFileInput.value = '';
        });
    });
</script>
