{# Shared head content for stats pages #}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
    #map {
        height: 400px;
        border-radius: 12px;
        z-index: 1;
        border: 1px solid var(--border-soft);
    }

    /* Legend Filter Interaktif */
    .legend-filter-item {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 10px;
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.2s ease;
        border: 1px solid #dee2e6;
        background: white;
        user-select: none;
    }

    .legend-filter-item:hover {
        transform: translateY(-1px);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .legend-filter-item.active {
        border-color: transparent;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
    }

    .legend-filter-item:not(.active) {
        opacity: 0.45;
        filter: grayscale(0.7);
    }

    .legend-filter-item:not(.active):hover {
        opacity: 0.7;
        filter: grayscale(0.3);
    }

    .legend-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
    }

    .legend-label {
        font-weight: 500;
        font-size: 0.75rem;
    }

    .legend-count {
        font-size: 0.65rem;
        padding: 1px 5px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.08);
        font-weight: 600;
        min-width: 18px;
        text-align: center;
    }

    .legend-filter-item.active .legend-count {
        background: rgba(0, 0, 0, 0.1);
    }

    /* Pulse animation for filtered state */
    @keyframes legendPulse {
        0%,
        100% {
            transform: scale(1);
        }

        50% {
            transform: scale(1.05);
        }
    }

    .legend-filter-item.solo-active {
        animation: legendPulse 0.3s ease;
    }
</style>
