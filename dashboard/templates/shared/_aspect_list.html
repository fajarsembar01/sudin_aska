{% macro aspect_list(aspects, owner_id, owner_name, id_prefix) %}
{% if aspects %}
  {% for a in aspects %}
  <div class="col-12 col-sm-6 col-lg-4 aspect-item" data-aspect-id="{{ a.id }}">
    <div class="d-flex align-items-center justify-content-between gap-2 rounded border px-2 py-1 bg-light small {% if not a.active %}opacity-75{% endif %}">
      <div class="d-flex align-items-center gap-2 text-truncate">
        <span class="badge bg-success-subtle text-success rounded-circle d-flex align-items-center justify-content-center" style="width: 20px; height: 20px;">
          <i class="bi bi-check-lg" style="font-size: 0.75rem;"></i>
        </span>
        <span class="text-truncate">{{ a.name }}</span>
        <span class="badge rounded-pill aspect-required-badge {% if a.is_required %}bg-warning-subtle text-warning{% else %}bg-secondary-subtle text-secondary{% endif %}"
              data-aspect-id="{{ a.id }}"
              data-{{ id_prefix }}-id="{{ owner_id }}"
              data-is-required="{{ 'true' if a.is_required else 'false' }}"
              style="cursor: pointer;">
          {% if a.is_required %}Wajib{% else %}Opsional{% endif %}
        </span>
        {% if not a.active %}
        <span class="badge bg-danger-subtle text-danger">Off</span>
        {% endif %}
      </div>
      <div class="d-flex align-items-center gap-1 flex-shrink-0">
        <button type="button" class="btn btn-link btn-sm p-0 text-primary"
          data-edit-aspect="{{ a.id }}"
          data-{{ id_prefix }}-id="{{ owner_id }}"
          data-{{ id_prefix }}-name="{{ owner_name }}"
          data-aspect-name="{{ a.name }}"
          data-aspect-desc="{{ a.description or '' }}"
          data-aspect-order="{{ a.sort_order or 0 }}"
          data-aspect-active="{{ 'true' if a.active else 'false' }}"
          data-aspect-required="{{ 'true' if a.is_required else 'false' }}"
          title="Edit aspek">
          <i class="bi bi-pencil"></i>
        </button>
        <button type="button" class="btn btn-link btn-sm p-0 text-danger"
          data-delete-aspect="{{ a.id }}"
          data-{{ id_prefix }}-id="{{ owner_id }}"
          data-{{ id_prefix }}-name="{{ owner_name }}"
          data-aspect-name="{{ a.name }}"
          title="Hapus aspek">
          <i class="bi bi-trash"></i>
        </button>
      </div>
    </div>
  </div>
  {% endfor %}
{% else %}
  <p class="text-muted small mb-3">Belum ada aspek penilaian</p>
{% endif %}
{% endmacro %}
