name: 🚀 Deploy Runtime ASKA

on:
  workflow_dispatch:
    inputs:
      sync_github_performance:
        description: Sinkronkan ulang atribusi Coding Update setelah deploy
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-runtime:
    name: Sync Kode Runtime & Restart Server
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🔑 Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -l -f ~/.ssh/id_ed25519
          cat >> ~/.ssh/config <<EOF
          Host ${SERVER_HOST}
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            IdentityFile ~/.ssh/id_ed25519
          EOF

      - name: 📦 Sync kode runtime ke server
        run: |
          rsync -avz --progress \
            ai_core.py \
            handlers.py \
            knowledge_loader.py \
            utils.py \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PROJECT_PATH }}/
          rsync -avz --progress \
            responses/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PROJECT_PATH }}/responses/
          rsync -avz --progress \
            web_aska/handlers.py \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PROJECT_PATH }}/web_aska/handlers.py
          rsync -avz --progress \
            dashboard/monev_bos/routes.py \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PROJECT_PATH }}/dashboard/monev_bos/routes.py
          rsync -avz --progress \
            dashboard/monev_bos/queries.py \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PROJECT_PATH }}/dashboard/monev_bos/queries.py
          rsync -avz --progress \
            dashboard/laporan/routes.py \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PROJECT_PATH }}/dashboard/laporan/routes.py
          rsync -avz --progress \
            dashboard/queries.py \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PROJECT_PATH }}/dashboard/queries.py
          rsync -avz --progress \
            dashboard/pengaturan/github_performance.py \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PROJECT_PATH }}/dashboard/pengaturan/github_performance.py
          rsync -avz --progress \
            dashboard/templates/admin_performance.html \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PROJECT_PATH }}/dashboard/templates/admin_performance.html
          rsync -avz --progress \
            dashboard/monev_bos/templates/monev_bos/sekolah/activities.html \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PROJECT_PATH }}/dashboard/monev_bos/templates/monev_bos/sekolah/activities.html
          rsync -avz --progress \
            dashboard/monev_bos/templates/monev_bos/base_monev_bos.html \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PROJECT_PATH }}/dashboard/monev_bos/templates/monev_bos/base_monev_bos.html
          rsync -avz --progress \
            dashboard/monev_bos/templates/monev_bos/social/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PROJECT_PATH }}/dashboard/monev_bos/templates/monev_bos/social/
          rsync -avz --progress \
            dashboard/monev_bos/templates/monev_bos/admin/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PROJECT_PATH }}/dashboard/monev_bos/templates/monev_bos/admin/
          rsync -avz --progress \
            dashboard/schema.py \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PROJECT_PATH }}/dashboard/schema.py

      - name: 🔄 Reload ASKA di server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd ${{ secrets.SERVER_PROJECT_PATH }} && \
             echo '✅ Kode runtime diperbarui!' && \
             (sudo systemctl restart aska 2>/dev/null || pm2 restart aska 2>/dev/null || echo '⚠️ Restart manual diperlukan')"

      - name: 🔄 Restart dashboard
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd ${{ secrets.SERVER_PROJECT_PATH }} && \
             sudo systemctl restart aska-dashboard.service && \
             sudo systemctl is-active aska-dashboard.service"

      - name: 🔃 Sinkronkan atribusi Coding Update
        if: ${{ inputs.sync_github_performance }}
        env:
          SYNC_GITHUB_TOKEN: ${{ github.token }}
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd ${{ secrets.SERVER_PROJECT_PATH }} && GITHUB_TOKEN='$SYNC_GITHUB_TOKEN' ./venv/bin/python -" <<'PY'
          from dashboard.pengaturan.github_performance import (
              hydrate_commit_line_stats,
              list_admin_github_accounts,
              sync_admin_commits,
          )

          repository = "fajarsembar01/sudin_aska"
          accounts = [
              account for account in list_admin_github_accounts()
              if account.get("github_username")
          ]
          actor_id = next(
              (
                  int(account["id"])
                  for account in accounts
                  if account["github_username"] == "fajarsembar01"
              ),
              int(accounts[0]["id"]),
          )
          for account in accounts:
              username = account["github_username"]
              result = sync_admin_commits(
                  repository,
                  username,
                  synced_by=actor_id,
                  author_email=account.get("github_author_email") or "",
              )
              hydrate_commit_line_stats(
                  repository, username, start=None, end=None
              )
              print(f"{username}: {result['inserted']} perubahan atribusi")
          PY
